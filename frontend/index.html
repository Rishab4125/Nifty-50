<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nifty 50 Return Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/2.0.0/modern-normalize.min.css"
    />
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #050816;
        color: #e5e7eb;
        margin: 0;
        padding: 24px;
      }

      .app-shell {
        max-width: 1200px;
        margin: 0 auto;
      }

      .card {
        background: radial-gradient(circle at top left, #1f2937, #020617);
        border-radius: 16px;
        padding: 20px 24px;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.25);
      }

      h1 {
        font-size: 1.8rem;
        margin-bottom: 0.25rem;
      }

      h2 {
        font-size: 1.1rem;
        margin-top: 1.5rem;
        margin-bottom: 0.5rem;
        color: #9ca3af;
      }

      .subheading {
        color: #9ca3af;
        margin-bottom: 1.25rem;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        margin-bottom: 1rem;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 0.9rem;
      }

      .field label {
        color: #9ca3af;
      }

      .field input[type="date"] {
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid #4b5563;
        background: #020617;
        color: #e5e7eb;
      }

      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      .toggle input {
        display: none;
      }

      .toggle-pill {
        width: 38px;
        height: 20px;
        border-radius: 999px;
        background: #374151;
        position: relative;
        transition: background 0.18s ease;
      }

      .toggle-pill-knob {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        background: #e5e7eb;
        transition: transform 0.18s ease;
      }

      .toggle input:checked + .toggle-pill {
        background: #22c55e;
      }

      .toggle input:checked + .toggle-pill .toggle-pill-knob {
        transform: translateX(18px);
      }

      button.primary {
        border-radius: 999px;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: #020617;
        padding: 8px 18px;
        border: none;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.9rem;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 12px 30px rgba(34, 197, 94, 0.35);
      }

      button.primary:disabled {
        opacity: 0.5;
        cursor: default;
        box-shadow: none;
      }

      .status {
        font-size: 0.85rem;
        color: #9ca3af;
        min-height: 20px;
        margin-bottom: 0.5rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0.5rem;
        font-size: 0.85rem;
      }

      th,
      td {
        padding: 8px 10px;
        text-align: right;
        border-bottom: 1px solid rgba(31, 41, 55, 0.9);
      }

      th:first-child,
      td:first-child {
        text-align: left;
      }

      thead {
        background: rgba(15, 23, 42, 0.95);
        position: sticky;
        top: 0;
        z-index: 1;
      }

      tbody tr:nth-child(even) {
        background: rgba(15, 23, 42, 0.6);
      }

      tbody tr:hover {
        background: rgba(31, 41, 55, 0.95);
      }

      .returns-container {
        max-height: 550px;
        overflow: auto;
        border-radius: 12px;
        border: 1px solid rgba(55, 65, 81, 0.9);
        margin-top: 0.5rem;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 0.75rem;
        background: rgba(15, 23, 42, 1);
        border: 1px solid rgba(75, 85, 99, 0.9);
        color: #9ca3af;
      }

      .badge-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #22c55e;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 0.7rem;
        border: 1px solid rgba(148, 163, 184, 0.5);
        color: #9ca3af;
        gap: 6px;
      }

      .pill-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #38bdf8;
      }

      .pill-dot.secondary {
        background: #a855f7;
      }

      .pill-dot.tertiary {
        background: #f97316;
      }

      .pill + .pill {
        margin-left: 6px;
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
      }

      .table-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 0.25rem;
        margin-bottom: 0.25rem;
        font-size: 0.8rem;
        color: #9ca3af;
      }

      .sort-indicator {
        font-size: 0.7rem;
        opacity: 0.8;
        margin-left: 4px;
      }

      .th-clickable {
        cursor: pointer;
        user-select: none;
      }

      @media (max-width: 768px) {
        body {
          padding: 16px;
        }
        .card {
          padding: 16px;
        }
        .controls {
          align-items: flex-start;
        }
        table {
          font-size: 0.8rem;
        }
        th,
        td {
          padding: 6px 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script>
      const { useState, useEffect } = React;

      function formatPct(v) {
        if (v === null || v === undefined || Number.isNaN(v)) return "—";
        const pct = v * 100;
        return pct.toFixed(1) + "%";
      }

      function NiftyApp() {
        const [asOf, setAsOf] = useState(() => {
          const today = new Date();
          return today.toISOString().slice(0, 10);
        });
        const [includeDividends, setIncludeDividends] = useState(false);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");
        const [data, setData] = useState(null);
        const [sortConfig, setSortConfig] = useState({
          key: "five_year",
          direction: "desc",
        });

        async function fetchReturns() {
          setLoading(true);
          setError("");
          try {
            const res = await fetch("http://127.0.0.1:8000/api/returns", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                as_of_date: asOf,
                include_dividends: includeDividends,
              }),
            });
            if (!res.ok) {
              const text = await res.text();
              throw new Error(text || "Request failed");
            }
            const json = await res.json();
            setData(json);
          } catch (e) {
            console.error(e);
            setError(
              "Could not load data. Ensure backend (FastAPI) is running on port 8000."
            );
          } finally {
            setLoading(false);
          }
        }

        useEffect(() => {
          fetchReturns();
        }, []);

        function sortedStocks() {
          if (!data || !data.stocks) return [];
          const stocks = [...data.stocks];
          const { key, direction } = sortConfig || {};
          if (!key) return stocks;
          stocks.sort((a, b) => {
            const va = a[key] ?? -Infinity;
            const vb = b[key] ?? -Infinity;
            if (va === vb) return 0;
            if (direction === "asc") return va < vb ? -1 : 1;
            return va > vb ? -1 : 1;
          });
          return stocks;
        }

        function handleHeaderClick(key) {
          setSortConfig((prev) => {
            if (!prev || prev.key !== key) {
              return { key, direction: "desc" };
            }
            if (prev.direction === "desc") {
              return { key, direction: "asc" };
            }
            if (prev.direction === "asc") {
              return { key: null, direction: "desc" };
            }
            return { key, direction: "desc" };
          });
        }

        function sortLabel(key, label) {
          if (!sortConfig || sortConfig.key !== key || !sortConfig.key) {
            return label;
          }
          const arrow = sortConfig.direction === "asc" ? "▲" : "▼";
          return (
            label +
            " " +
            String.fromCharCode(160) +
            String.fromCharCode(160) +
            arrow
          );
        }

        function exportCsv() {
          if (!data || !data.stocks) return;
          const rows = [];
          rows.push([
            "Symbol",
            "Name",
            "1Y Return",
            "3Y Return",
            "5Y Return",
            "AsOf",
            "IncludeDividends",
          ]);
          sortedStocks().forEach((s) => {
            rows.push([
              s.symbol,
              s.name || "",
              s.one_year ?? "",
              s.three_year ?? "",
              s.five_year ?? "",
              data.as_of_date,
              data.include_dividends ? "1" : "0",
            ]);
          });
          const csv = rows
            .map((row) =>
              row
                .map((v) => {
                  const val = v === null || v === undefined ? "" : String(v);
                  if (val.includes(",") || val.includes('"')) {
                    return `"${val.replace(/"/g, '""')}"`;
                  }
                  return val;
                })
                .join(",")
            )
            .join("\n");
          const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          const suffix = includeDividends ? "with-dividends" : "price-only";
          a.href = url;
          a.download = `nifty50-returns-${data.as_of_date}-${suffix}.csv`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }

        return React.createElement(
          "div",
          { className: "app-shell" },
          React.createElement(
            "div",
            { className: "card" },
            React.createElement(
              "div",
              null,
              React.createElement(
                "div",
                { style: { display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12 } },
                React.createElement(
                  "div",
                  null,
                  React.createElement("h1", null, "Nifty 50 Return Tracker"),
                  React.createElement(
                    "div",
                    { className: "subheading" },
                    "Exact 1 / 3 / 5 year returns as of a chosen date, with splits/bonus handled and optional dividends."
                  )
                ),
                React.createElement(
                  "div",
                  { className: "badge" },
                  React.createElement("span", { className: "badge-dot" }),
                  "Live data via Yahoo Finance (adjusted for splits; dividends toggle)"
                )
              ),
              React.createElement(
                "div",
                { className: "pill-row" },
                React.createElement(
                  "div",
                  { className: "pill" },
                  React.createElement("span", { className: "pill-dot" }),
                  "Price return with splits/bonus"
                ),
                React.createElement(
                  "div",
                  { className: "pill" },
                  React.createElement("span", { className: "pill-dot secondary" }),
                  "Optional dividend cashflows"
                ),
                React.createElement(
                  "div",
                  { className: "pill" },
                  React.createElement("span", { className: "pill-dot tertiary" }),
                  "Exact lookback from selected date"
                )
              )
            ),
            React.createElement(
              "div",
              { className: "controls" },
              React.createElement(
                "div",
                { className: "field" },
                React.createElement("label", null, "As-of date"),
                React.createElement("input", {
                  type: "date",
                  value: asOf,
                  max: new Date().toISOString().slice(0, 10),
                  onChange: (e) => setAsOf(e.target.value),
                })
              ),
              React.createElement(
                "label",
                { className: "toggle" },
                React.createElement("input", {
                  type: "checkbox",
                  checked: includeDividends,
                  onChange: (e) => setIncludeDividends(e.target.checked),
                }),
                React.createElement(
                  "span",
                  { className: "toggle-pill" },
                  React.createElement("span", { className: "toggle-pill-knob" })
                ),
                React.createElement(
                  "span",
                  null,
                  includeDividends ? "Include dividends" : "Exclude dividends"
                )
              ),
              React.createElement(
                "button",
                {
                  className: "primary",
                  onClick: fetchReturns,
                  disabled: loading,
                },
                loading ? "Refreshing…" : "Refresh returns"
              )
            ),
            React.createElement(
              "div",
              { className: "status" },
              error
                ? error
                : data
                ? `As of ${data.as_of_date} · Showing ${
                    data.stocks?.length || 0
                  } stocks · Dividends ${
                    data.include_dividends ? "included" : "excluded"
                  }.`
                : "Loading..."
            ),
            React.createElement(
              "div",
              { className: "table-toolbar" },
              React.createElement(
                "span",
                null,
                sortConfig && sortConfig.key
                  ? `Sorted by ${
                      sortConfig.key === "one_year"
                        ? "1Y"
                        : sortConfig.key === "three_year"
                        ? "3Y"
                        : "5Y"
                    } (${sortConfig.direction === "asc" ? "low → high" : "high → low"})`
                  : "No sorting applied"
              ),
              React.createElement(
                "button",
                {
                  className: "primary",
                  onClick: exportCsv,
                  disabled: !data || !data.stocks || loading,
                },
                "Export CSV"
              )
            ),
            React.createElement(
              "div",
              { className: "returns-container" },
              data &&
                React.createElement(
                  "table",
                  null,
                  React.createElement(
                    "thead",
                    null,
                    React.createElement(
                      "tr",
                      null,
                      React.createElement("th", null, "Stock"),
                      React.createElement(
                        "th",
                        {
                          className: "th-clickable",
                          onClick: () => handleHeaderClick("one_year"),
                        },
                        sortLabel("one_year", "1Y")
                      ),
                      React.createElement(
                        "th",
                        {
                          className: "th-clickable",
                          onClick: () => handleHeaderClick("three_year"),
                        },
                        sortLabel("three_year", "3Y")
                      ),
                      React.createElement(
                        "th",
                        {
                          className: "th-clickable",
                          onClick: () => handleHeaderClick("five_year"),
                        },
                        sortLabel("five_year", "5Y")
                      )
                    )
                  ),
                  React.createElement(
                    "tbody",
                    null,
                    sortedStocks().map((s) =>
                      React.createElement(
                        "tr",
                        { key: s.symbol },
                        React.createElement(
                          "td",
                          null,
                          React.createElement(
                            "div",
                            null,
                            s.symbol,
                            s.name
                              ? React.createElement(
                                  "span",
                                  {
                                    style: {
                                      display: "block",
                                      fontSize: "0.7rem",
                                      color: "#9ca3af",
                                      marginTop: 2,
                                    },
                                  },
                                  s.name
                                )
                              : null
                          )
                        ),
                        React.createElement(
                          "td",
                          { style: { color: (s.one_year ?? 0) >= 0 ? "#22c55e" : "#ef4444" } },
                          formatPct(s.one_year)
                        ),
                        React.createElement(
                          "td",
                          { style: { color: (s.three_year ?? 0) >= 0 ? "#22c55e" : "#ef4444" } },
                          formatPct(s.three_year)
                        ),
                        React.createElement(
                          "td",
                          { style: { color: (s.five_year ?? 0) >= 0 ? "#22c55e" : "#ef4444" } },
                          formatPct(s.five_year)
                        )
                      )
                    )
                  )
                )
            )
          )
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(React.createElement(NiftyApp));
    </script>
  </body>
  </html>
